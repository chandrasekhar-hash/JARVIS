version: '3.8'

services:
  cloud-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: jarvis-cloud-gateway
    ports:
      - "8001:8001"
    environment:
      - JARVIS_ENV=production
      - CLOUD_HOST=0.0.0.0
      - CLOUD_PORT=8001
      - DATABASE_URL=postgresql://jarvis_admin:jarvis_secure_pass_2026@postgres:5432/jarvis_cloud_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=jarvis_cloud_production_super_secret_jwt_key_32bytes
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: jarvis-cloud-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jarvis_admin
      POSTGRES_PASSWORD: jarvis_secure_pass_2026
      POSTGRES_DB: jarvis_cloud_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: jarvis-cloud-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
